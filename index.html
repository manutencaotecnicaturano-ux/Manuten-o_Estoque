<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#254e61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Máquinas">
<title>Controle de Máquinas · Turano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f8f9fb; --line:#e5e7eb; --line-2:#d6dae1;
  --text:#121721; --text-2:#545e6c; --text-3:#8a93a1;
  --accent:#245066; --accent-2:#1b3f51; --accent-soft:#e8f1f6; --brand:#36a8de;
  --ok:#0f6b3a; --ok-soft:#e7f4ec;
  --warn:#8a5600; --warn-soft:#fff3d9; --warn-line:#efc66c;
  --bad:#b3261e; --bad-soft:#fdeceb; --bad-line:#f2a29c;
  --info:#1f4fc8; --info-soft:#eaf0fe;
  --r:10px; --r-sm:7px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-size:22px} h2{font-size:16px} h3{font-size:14px}
a{color:var(--accent)}
[hidden]{display:none!important}
.mono{font-family:var(--mono);letter-spacing:0}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:15px;height:15px}

/* ---------- botões e campos ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:#eceef2}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn.lg{height:46px;padding:0 20px;font-size:15px}
.btn.icon{width:36px;padding:0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:500;color:var(--text-2)}
.input,select.input,textarea.input{height:38px;width:100%;padding:0 11px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.input{height:auto;min-height:74px;padding:9px 11px;resize:vertical}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,80,102,.16)}
.input[readonly]{background:var(--surface-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.span2{grid-column:span 2}
.check{display:flex;gap:9px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}

/* ---------- scanner ---------- */
.scan-wrap{position:relative}
.scan-wrap .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);width:22px;height:22px}
.scan{height:56px;width:100%;padding:0 16px 0 48px;border:2px solid var(--accent);border-radius:12px;font:600 18px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;outline:none;background:#fff}
.scan::placeholder{font:400 15px Inter,system-ui,sans-serif;letter-spacing:0;text-transform:none;color:var(--text-3)}
.scan:focus{box-shadow:0 0 0 4px rgba(36,80,102,.16)}
.scan.flash-ok{animation:fok .45s}
.scan.flash-warn{animation:fwarn .6s}
@keyframes fok{0%{background:var(--ok-soft)}100%{background:#fff}}
@keyframes fwarn{0%,60%{background:var(--warn-soft)}100%{background:#fff}}

/* ---------- cartões, chips ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-b{padding:16px}
.card-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 var(--r) var(--r)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:#eef0f3;color:var(--text-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.badge{min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.empty{padding:28px 16px;text-align:center;color:var(--text-3)}
.divider{height:1px;background:var(--line);margin:4px 0}

/* ---------- layout ---------- */
#app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px;padding:0 16px;padding-top:env(safe-area-inset-top);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.brand-mark{width:30px;height:30px;display:grid;place-items:center;flex:none}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand small{display:block;font-weight:400;color:var(--text-3);font-size:11.5px;line-height:1.1}
main{padding:18px 16px 96px;max-width:1320px;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h p{margin:4px 0 0;color:var(--text-2)}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11px;color:var(--text-3);cursor:pointer;position:relative}
.bottom button.on{color:var(--accent)}
.bottom button .ic{width:21px;height:21px}
.bottom .main-act .ic-wrap{width:44px;height:44px;margin-top:-18px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(36,80,102,.35)}
.bottom .main-act{color:var(--accent)}
.bottom .badge{position:absolute;top:4px;left:calc(50% + 6px)}
body.sem-barra main{padding-bottom:32px}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-width:1080px}
.mod{position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.mod:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,24,40,.09)}
.mod .mi{width:66px;height:66px;border-radius:18px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.mod .mi .ic{width:32px;height:32px;stroke-width:1.6}
.mod .mn{font-weight:600;font-size:15px;line-height:1.25}
.mod>.badge{position:absolute;top:12px;right:12px;height:24px;min-width:24px;font-size:12.5px;padding:0 7px}
.mod.breve{cursor:default;background:var(--surface-2);box-shadow:none;border-style:dashed}
.mod.breve:hover{transform:none;border-color:var(--line);box-shadow:none}
.mod.breve .mi{background:var(--warn-soft);color:var(--warn)}
.mod.breve .mn{color:var(--text-2)}
.mod .md2{font-size:12.5px;color:var(--text-2);line-height:1.35;margin-top:-8px}
.obra-tiles .mod{aspect-ratio:auto;min-height:168px}
@media (max-width:640px){.obra-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.obra-tiles .mod{min-height:150px;gap:10px;padding:12px}.obra-tiles .mod .md2{display:none}}
.avisos{display:flex;flex-direction:column;gap:8px;margin:0 0 18px;max-width:1080px}
.aviso{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.aviso>.ic{color:var(--text-3)}
.aviso.acao{border-color:#b9d3e0;background:#f3f8fb}.aviso.acao>.ic{color:var(--accent)}
.aviso .t{font-weight:500}
.aviso .small{color:var(--text-2)}
@media (max-width:640px){.aviso{flex-wrap:wrap}.aviso .grow{flex-basis:calc(100% - 34px)}.aviso .btn{margin-left:30px}.aviso .btn+.btn{margin-left:0}}
.tag-breve{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--warn)}
@media (max-width:640px){.mods{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mod{gap:10px;border-radius:14px}.mod .mi{width:54px;height:54px;border-radius:15px}.mod .mi .ic{width:27px;height:27px}.mod .mn{font-size:14px}}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.cols>*{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpis .kpi:first-child{grid-column:span 2}
.kpi{padding:14px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);transition:border-color .15s}
.kpi:hover{border-color:var(--line-2)}
.kpi .n{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.kpi .l{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--bad-line);background:var(--bad-soft);color:var(--bad);margin-bottom:14px;cursor:pointer}
.banner.warn{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.banner b{font-weight:600}

@media (min-width:720px){
  .kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
  .kpis .kpi:first-child{grid-column:auto}
}
@media (min-width:1024px){
  #app{display:grid;grid-template-columns:244px minmax(0,1fr)}
  .top,.bottom{display:none}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px}
  .side .brand{padding:2px 8px 18px}
  .side .brand-mark{width:34px;height:34px}
  .nav-g{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);padding:14px 10px 6px}
  .nav-i{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:0;border-radius:8px;background:none;color:var(--text-2);cursor:pointer;font-weight:500;text-align:left}
  .nav-i:hover{background:var(--surface-2);color:var(--text)}
  .nav-i.on{background:var(--accent-soft);color:var(--accent)}
  .nav-i .badge{margin-left:auto}
  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
  main{padding:28px 32px 48px;width:100%}
  .cols.c2{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
  .cols.c2b{grid-template-columns:380px minmax(0,1fr);align-items:start}
  .cols.c2c{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .sticky{position:sticky;top:24px}
}
@media (max-width:640px){
  .grid2,.grid3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  h1{font-size:20px}
  .hide-m{display:none!important}
  .toolbar .search{flex-basis:100%}
  .toolbar select.input{flex:1 1 calc(50% - 4px);max-width:none;min-width:0}
  .page-h>.row{width:100%;flex-wrap:wrap}
  .page-h>.row .btn{flex:1 1 auto}
}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li.click{cursor:pointer}
.li.click:hover{background:var(--surface-2)}
.li .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12.5px;color:var(--text-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-family:var(--mono);font-weight:600;font-size:13px;background:#eef0f3;border-radius:5px;padding:2px 6px;white-space:nowrap}
.state{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none;background:#eef0f3;color:var(--text-3)}
.state.ok{background:var(--ok-soft);color:var(--ok)}
.state.warn{background:var(--warn-soft);color:var(--warn)}
.state.bad{background:var(--bad-soft);color:var(--bad)}
.state.info{background:var(--info-soft);color:var(--info)}
.bars .li{gap:10px}
.bar{height:6px;border-radius:99px;background:#eceef2;overflow:hidden;flex:1;min-width:40px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--text-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .input{width:auto;min-width:150px}
.search{position:relative;flex:1;min-width:220px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
.search .input{padding-left:36px;width:100%}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:500;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.seg{display:inline-flex;background:#eceef2;border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;height:30px;padding:0 11px;border-radius:6px;cursor:pointer;font-weight:500;color:var(--text-2);font-size:13px}
.seg button.on{background:#fff;color:var(--text);box-shadow:var(--shadow)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cardx{padding:14px 16px;cursor:pointer}
.cardx:hover{border-color:var(--line-2)}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 16px}
.kv>div>span{display:block;font-size:12px;color:var(--text-3)}
.kv div b{font-weight:500;word-break:break-word}
.alert-card{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.alert-card:first-child{border-top:0}
.alert-card.inc{border-left:3px solid var(--bad);background:linear-gradient(90deg,var(--bad-soft),#fff 40%)}
.alert-card.att{border-left:3px solid var(--warn-line)}
.alert-card.res{opacity:.75}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl:before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl:last-child:before{display:none}
.tl i{width:9px;height:9px;border-radius:50%;background:var(--line-2);margin:5px 0 0 4px;position:relative}
.tl i.ok{background:var(--ok)} .tl i.info{background:var(--info)} .tl i.bad{background:var(--bad)} .tl i.warn{background:#d39a1d}
.progress{height:8px;border-radius:99px;background:#eceef2;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--brand);transition:width .25s}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sum>div{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sum>div>b{display:block;font-size:20px;font-weight:600}
.sum>div>span{font-size:12px;color:var(--text-2)}
.unknown{border:1px dashed var(--warn-line);background:var(--warn-soft);border-radius:10px;padding:12px;margin-top:12px}
.perm-g{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin:14px 0 6px}
.perm-g:first-child{margin-top:0}
.perms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 16px}
.perm{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer}
.perm:hover{background:var(--surface-2)}
.perm input{margin-top:2px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.perm .pt{font-weight:500}
.perm .pd{font-size:12px;color:var(--text-3);line-height:1.35}
.perm.mais{background:var(--ok-soft)} .perm.menos{background:var(--bad-soft)}
.perm .chip{height:18px;font-size:11px;margin-left:4px;vertical-align:1px}
.os-cost{display:flex;gap:10px;flex-wrap:wrap}
.os-cost div{flex:1;min-width:110px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.os-cost span{display:block;font-size:12px;color:var(--text-2)} .os-cost b{font-size:16px;font-weight:600}
.item-add{display:grid;grid-template-columns:130px minmax(0,1fr) 70px 110px auto;gap:8px;align-items:end}
.box-txt{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.show-m{display:none}
.obra{border-left:4px solid transparent}
.obra.bad{border-left-color:var(--bad);background:linear-gradient(90deg,var(--bad-soft),var(--surface) 55%)}
.obra.warn{border-left-color:#e0a930;background:linear-gradient(90deg,var(--warn-soft),var(--surface) 55%)}
.obra.calma{background:var(--surface-2);box-shadow:none;border-left-color:var(--line)}
.obra.calma>div:first-child>div>div:first-child{color:var(--text-2)}
.obra-sum{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:640px){.obra-sum{grid-template-columns:repeat(2,minmax(0,1fr))}.obra-sum div:last-child{grid-column:span 2}}
@media (max-width:640px){.show-m{display:block}.perms{grid-template-columns:1fr}.item-add{grid-template-columns:1fr 1fr}.item-add .wide{grid-column:span 2}}

/* ---------- modal, toast ---------- */
.ov{position:fixed;inset:0;background:rgba(15,20,30,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.md{background:var(--surface);width:100%;max-height:92vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;box-shadow:var(--shadow-lg);animation:up .2s ease-out}
.md-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.md-b{padding:18px;overflow:auto}
.md-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
@media (min-width:720px){
  .ov{align-items:center;padding:24px}
  .md{max-width:560px;border-radius:14px}
  .md.wide{max-width:820px}
  .md-f{border-radius:0 0 14px 14px;padding-bottom:12px}
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:460px}
.toast{background:#151b24;color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-weight:500;display:flex;gap:9px;align-items:center;animation:up .2s}
.toast.ok .ic{color:#7fd8a8} .toast.warn .ic{color:#f6c86b} .toast.bad .ic{color:#ff9c95}
@media (min-width:1024px){#toast{top:20px;left:auto;right:24px;transform:none;align-items:flex-end;width:auto}}
.tbl td.nw{white-space:nowrap}
.toolbar select.input{max-width:210px}
select.input{min-width:0;text-overflow:ellipsis}
.rede{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);cursor:pointer}
.rede[hidden]{display:none}
.rede .rede-p{width:8px;height:8px;border-radius:50%;background:#8a94a3}
.rede.off .rede-p{background:#c98a12}.rede.sinc .rede-p{background:var(--accent);animation:pulso 1s infinite}.rede.bad .rede-p{background:#c0392b}
body.sem-barra .rede{bottom:calc(16px + env(safe-area-inset-bottom))}
@media (min-width:1024px){.rede{bottom:20px}}
@keyframes pulso{50%{opacity:.3}}
#loading{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;overflow:hidden}
#loading i{display:block;height:100%;width:30%;background:var(--accent);animation:load 1s infinite ease-in-out}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(400%)}}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:100%;max-width:380px;padding:28px}
.login-logo{display:block;width:180px;height:auto;margin:0 auto 22px}
.login .card{text-align:left}
.login h1{font-size:20px}
.login p{color:var(--text-2);margin:6px 0 22px}
.err{color:var(--bad);font-size:13px;min-height:18px}

/* ---------- impressão ---------- */
#print-root{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  @page{margin:10mm}
}
/* Etiqueta padrão Turano: 35 x 20 mm, borda preta, QR à esquerda, marca e TAG à direita */
.labels{display:grid;grid-template-columns:repeat(5,35mm);gap:3mm 3mm}
.labels.rolo{display:block}
.labels.rolo .label:not(:last-child){break-after:page;page-break-after:always}
.label{width:35mm;height:20mm;box-sizing:border-box;border:0.3mm solid #000;background:#fff;color:#000;padding:1mm 1.4mm 1mm 1mm;display:flex;align-items:center;gap:1.2mm;break-inside:avoid;overflow:hidden;font-family:Inter,Arial,sans-serif}
.label .qr{width:17.6mm;height:17.6mm;flex:none;display:block}
.label .lr{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:0.6mm 0 0.4mm}
.label .lg{display:flex;align-items:center;gap:0.6mm;min-width:0}
.label .lg img{height:3.6mm;width:auto;flex:none}
.label .lg b{display:block;font-weight:600;font-size:4.5pt;letter-spacing:.08em;line-height:1}
.label .lg small{display:block;font-size:2.2pt;letter-spacing:.12em;margin-top:.4mm;line-height:1}
.label .tg{font-weight:800;line-height:1;white-space:nowrap;letter-spacing:0}
.label-prev{display:flex;justify-content:center;padding:18px 0 8px}
.label-prev .label{transform:scale(2.4);transform-origin:top center;margin-bottom:28mm;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.doc{font-family:Inter,Arial,sans-serif;color:#000;font-size:10.5pt}
.doc h1{font-size:16pt}
.doc table{width:100%;border-collapse:collapse;margin-top:6mm}
.doc th,.doc td{border:0.3mm solid #999;padding:2mm;text-align:left}
.doc .sig{display:grid;grid-template-columns:1fr 1fr;gap:16mm;margin-top:18mm}
.doc .sig div{border-top:0.3mm solid #000;padding-top:2mm;text-align:center}

/* ---------- solicitações, fotos, fretes ---------- */
.sol-tipos .mod{aspect-ratio:auto;min-height:190px}
.sol-tipos .mod .small{max-width:220px}
.hl{background:var(--warn-soft);color:var(--warn);padding:0 5px;border-radius:4px;font-weight:700;letter-spacing:.03em}
.suf-wrap{position:relative}
.suf-wrap .input{padding-right:58px}
.suf{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:5px;font-size:12.5px;pointer-events:none}
.fotos{display:flex;flex-wrap:wrap;gap:8px}
.foto{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0;cursor:pointer;display:grid;place-items:center}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto.erro{background:var(--bad-soft)}
.foto.add{border-style:dashed;color:var(--text-2);font-size:12px;gap:2px;align-content:center;justify-items:center}
.foto-x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.foto-ov{position:fixed;inset:0;z-index:80;background:rgba(10,14,20,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;cursor:zoom-out}
.foto-ov img{max-width:100%;max-height:82vh;border-radius:8px}
.conserto{padding:12px 16px;border-top:1px solid var(--line)}
.conserto:first-of-type{border-top:0}
.fila{display:flex;flex-direction:column;gap:8px}
.fr{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.fr.arrastavel{cursor:grab}
.fr.drag{opacity:.45}
.fr.antes{box-shadow:inset 0 3px 0 var(--accent)}
.fr.depois{box-shadow:inset 0 -3px 0 var(--accent)}
.fr-ord{display:flex;flex-direction:column;align-items:center;gap:0;flex:none;color:var(--text-3)}
.fr-ord .btn.icon{width:30px;height:24px;font-size:11px}
.fr-ord b{font-size:15px;color:var(--text)}
.quadros{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(258px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start;scroll-snap-type:x proximity}
.qd{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:180px;scroll-snap-align:start;transition:background .12s,border-color .12s}
.qd.carga{background:#f3f7f9;border-color:#d5e3ea}
.qd.sobre{background:var(--accent-soft);border-color:var(--accent)}
.qd-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 2px 8px}
.qd-h b{font-size:14px}.qd-h b.click{cursor:pointer;border-bottom:1px dashed var(--line-2)}
.qd-d{margin-left:auto}
.qd-a{gap:6px;margin:0 0 8px}
.qd-t{display:flex;align-items:center;gap:5px;margin:-2px 0 8px}
.qd-b{display:flex;flex-direction:column;gap:8px}
.quadros.dias .qd-b{max-height:52vh;overflow-y:auto;padding:2px;margin:-2px}
@media (max-width:640px){.quadros{grid-auto-columns:82%}.quadros.dias .qd-b{max-height:none}}
.qd-vazio{border:1.5px dashed var(--line-2);border-radius:10px;padding:18px 10px;text-align:center;color:var(--text-3);font-size:12.5px}
.frc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.frc:hover{border-color:var(--line-2)}
.frc[draggable=true]{cursor:grab}
.frc.drag{opacity:.45}
.frc.atraso{border-left:4px solid var(--bad)}
.frc.pend{opacity:.7}
.frc.antes{box-shadow:0 -3px 0 var(--accent)}.frc.depois{box-shadow:0 3px 0 var(--accent)}
.frc-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.frc-h b{font-size:13.5px}
.frc-r{margin-top:6px;font-weight:500;font-size:13.5px}
.frc-i{margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ord-wrap{display:flex;gap:6px;align-items:flex-start}.ord-wrap .frc{flex:1}
.ord{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:9px}
.fr-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.toast-b{margin-left:6px;background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:7px;padding:4px 10px;font-weight:600;cursor:pointer}
.rc-item.ok{border-color:#9fd4b4;background:#f6fbf8}.rc-item.falta{border-color:var(--bad-line);background:#fff8f7}.rc-item.parc{border-color:var(--warn-line);background:#fffbf1}
/* romaneio impresso */
.rmn-doc{font:11pt/1.4 Inter,Arial,sans-serif;color:#000}
.rmn.pg{page-break-after:always;break-after:page}
.rmn.pg:last-child{page-break-after:auto;break-after:auto}
.rmn-top{display:flex;gap:14px;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px}
.rmn-top img{width:15mm;height:auto}
.rmn-top .grow{flex:1}
.rmn-emp{font-size:9pt;text-transform:uppercase;letter-spacing:.06em;color:#444}
.rmn h1{font-size:17pt;margin:2px 0}
.rmn-sub{font-size:9.5pt;color:#333}
.rmn-cod{text-align:center;flex:none}
.rmn-cod .c128{width:62mm;height:15mm;display:block}
.rmn-cod .mono{font-size:12pt;font-weight:700;letter-spacing:.12em;margin-top:2px}
.rmn-od{display:flex;gap:10px;align-items:stretch;margin-bottom:14px}
.rmn-od>div:not(.rmn-seta){flex:1;border:1px solid #999;border-radius:6px;padding:8px 10px}
.rmn-od span{display:block;font-size:8.5pt;text-transform:uppercase;color:#555;letter-spacing:.05em}
.rmn-od b{display:block;font-size:12.5pt}
.rmn-od small{display:block;color:#333;font-size:9pt}
.rmn-seta{display:flex;align-items:center;font-size:18pt}
.rmn-t{width:100%;border-collapse:collapse;margin-bottom:12px}
.rmn-t th{font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;text-align:left;border-bottom:1.5px solid #000;padding:5px 6px}
.rmn-t td{border-bottom:1px solid #bbb;padding:7px 6px;vertical-align:top}
.rmn-end{font-size:8.5pt;color:#444}
.rmn-conf{white-space:nowrap;font-size:10pt}
.rmn-obs{border:1px solid #999;border-radius:6px;padding:8px 10px;margin-bottom:12px;font-size:10pt}
.rmn-ass{display:grid;grid-template-columns:1fr 1.4fr;gap:28px;margin-top:26px}
.rmn-ass>div{display:flex;flex-direction:column}
.rmn-ass span{font-weight:700;font-size:10pt;margin-bottom:26px}
.rmn-ass i{display:block;border-bottom:1px solid #000;height:0;margin-top:22px}
.rmn-ass small{font-size:8.5pt;color:#444;margin-top:3px}
.rmn-pe{margin-top:20px;font-size:8.5pt;color:#555;border-top:1px dashed #999;padding-top:6px}
.prios{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.prio{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:9px 8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:2px}
.prio span{font-size:12px;color:var(--text-2)}
.prio.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(36,80,102,.2);background:var(--accent-soft)}
.prio.bad.on{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 0 0 2px rgba(179,38,30,.15)}
.prio.warn.on{border-color:var(--warn-line);background:var(--warn-soft);box-shadow:none}
@media (max-width:640px){.prios{grid-template-columns:repeat(2,minmax(0,1fr))}.prio:last-child{grid-column:span 2}.fr{padding:10px 12px}.sol-tipos .mod{min-height:160px}}
label.li.check{cursor:pointer}
label.li.check input{margin-top:0}
details>summary{list-style:revert}
@media (max-width:640px){.li2{flex-wrap:wrap;row-gap:6px}.li2>.grow{flex-basis:calc(100% - 40px)}.li2>.chips{width:100%;padding-left:40px;justify-content:flex-start!important}}
.so-cel{display:none}
.car-li .t{white-space:normal}
@media (max-width:640px){.car-li{flex-wrap:wrap}.car-li .grow{flex-basis:calc(100% - 44px)}.car-li .car-q{margin-left:34px}}
@media (max-width:640px){.so-desk{display:none}.so-cel{display:block}.so-cel .li{flex-wrap:wrap}.so-cel .li .acoes{flex-basis:100%;display:flex;justify-content:flex-end}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>

// Abre com os dados guardados no aparelho (na hora) e atualiza em segundo plano.
// Sem nada guardado, espera a primeira carga do servidor.
function iniciar() {
  return lerFila().then(function () { return BD.ler(chaveDados()); }).then(function (c) {
    if (c && c.maq && c.maq.usuario) {
      SINC.versoes = c.versoes || {}; SINC.ultima = 0;
      SINC.dados = { maq: c.maq, frt: c.frt || null, est: c.est || null };
      if (c.frt) { FRT = copia(c.frt); aplicarFilaFrete(); }
      if (c.est) EST = copia(c.est);
      entrarComDados(copia(c.maq));
      sincronizar({ forcar: true });
      return;
    }
    if (!online()) { sairLocal('Sem internet. O primeiro acesso neste aparelho precisa de conexão.'); return; }
    carregando(1);
    return sincronizar({ primeira: true, forcar: true }).then(function () {
      carregando(-1);
      if (S) entrarComDados(S, true);
    }, function (e) {
      carregando(-1);
      const msg = String((e && e.message) || e);
      if (msg.indexOf('SESSAO_') < 0) toast(msg.replace(/^Error:\s?/, ''), 'bad');
    });
  }).catch(function () { });
}

function entrarComDados(p, jaAplicado) {
  {   // eslint: bloco mantido para o diff ficar pequeno
    if (!jaAplicado) aplicar(p, { doAparelho: true });
    telas('app');
    UI.env = ls('cm_env') || novoEnvio();
    UI.inv = ls('cm_inv');
    if (UI.inv && (!IDX.loc[UI.inv.local])) UI.inv = null;
    if (!IDX.loc[UI.env.origem]) UI.env.origem = origemPadrao();
    if (meuLocal()) UI.env.origem = meuLocal();
    abrirHash();
    // link do QR da etiqueta (…?m=TAG): abre o histórico da máquina
    let pend = null; try { pend = sessionStorage.getItem('cm_abrir'); sessionStorage.removeItem('cm_abrir'); } catch (e) { }
    if (pend) abrirHistorico(pend);
    mostrarRede();
  }
}

function aplicar(p, o) {
  o = o || {};
  if (p.versao && !o.doAparelho) { SINC.versoes.maq = p.versao; SINC.dados.maq = copia(p); guardarTudo(); }
  delete SINC.pend.maq;
  S = p;
  aplicarFilaLocal();
  indexar();
  montarCasca();
  if (UI.view) { if (UI.view !== 'modulos' && !navVisivel(UI.view)) irModulos(); else render(); }

      av.push({ n: 'info', id: 'fr:' + f.id, ic: 'info', t: 'Frete ' + f.id + ' recusado', s: f.motivo, act: 'frAbrir', arg: f.id, b: 'Ver' });
  });
  S.maquinas.forEach(function (m) {
    if (m.local === obra && !m.transito && m.condicao !== 'Baixada' && prevVencida(m))
      av.push({ n: 'info', id: 'prev:' + m.tag + ':' + (m.prevProxima || m.prevRestantes), ic: 'clock', t: 'Preventiva vencida: ' + m.tag + ' ' + m.tipo, s: 'O administrativo vai agendar a retirada para a manutenção.', act: 'histAbrir', arg: m.tag, b: 'Ver máquina' });

function avisosEnvio(m, origem, destino) {
  const av = [];
  if (!m) return av;
  const ld = IDX.loc[destino];
  if (m.fora) av.push({ c: 'bad', t: 'Consta em outro local' });
  else if (m.transito) av.push({ c: 'bad', t: 'Consta em trânsito no ' + m.transito });
  else if (m.local !== origem) av.push({ c: 'bad', t: 'Consta em ' + locNome(m.local) });
  if (m.condicao === 'Baixada') av.push({ c: 'bad', t: 'Máquina baixada' });
  else if (m.condicao !== 'Operando' && !(ld && ['Oficina interna', 'Oficina externa', 'Locadora'].indexOf(ld.tipo) >= 0)) av.push({ c: 'warn', t: m.condicao });
  if (m.naoLoc) av.push({ c: 'warn', t: 'Estava como não localizada' });
  return av;
}

function painelRecebimento() {

      '<div class="field"><span>Conferência</span><div class="row" style="height:38px">' + (rom ? '<div class="progress grow"><i style="width:' + (total ? Math.round(ok.length / total * 100) : 0) + '%"></i></div><b>' + ok.length + '/' + total + '</b>' : '<b>' + plural(r.lidos.length, 'máquina lida', 'máquinas lidas') + '</b>') + '</div></div></div>' +
      '<div class="small faint" style="margin-top:-6px">Se estiver lançando depois, ajuste a data e a hora reais da chegada.</div>' +
      '<div class="scan-wrap">' + ic('scan') + '<input class="scan" data-scan="rec" placeholder="Bipe a TAG da máquina que chegou" autocomplete="off" spellcheck="false"></div>' +
      (r.desconhecida ? blocoDesconhecida('rec', r.desconhecida) : '') +

      extras.map(function (t) { return linha(t, 'extra'); }).join('') + ok.map(function (t) { return linha(t, 'ok'); }).join('') + faltam.map(function (t) { return linha(t, 'pend'); }).join('') +
      (!r.lidos.length && !pendTags.length ? '<div class="empty">Nenhuma máquina lida.</div>' : '') +
    '</div>' +
    '<div class="card-f" style="justify-content:space-between;align-items:center"><span class="small faint">' + (faltam.length && rom ? plural(faltam.length, 'máquina não lida continua', 'máquinas não lidas continuam') + ' em trânsito' : '') + '</span>' +
      '<button class="btn primary" data-act="recConfirmar"' + (r.lidos.length ? '' : ' disabled') + '>' + ic('check') + 'Confirmar recebimento</button></div></div>';
}
SCAN.rec = function (tag, input) {

  const f = UI.maqF;

  return proprias().filter(function (m) {

    if (f.sit === 'ativas' && m.condicao === 'Baixada') return false;
    if (f.sit === 'operando' && s.t !== 'Operando') return false;
    if (f.sit === 'transito' && !m.transito) return false;
    if (f.sit === 'naoloc' && !(m.naoLoc && m.condicao !== 'Baixada')) return false;
    if (f.sit === 'manut' && COND_PARADA.indexOf(m.condicao) < 0) return false;
    if (f.sit === 'baixadas' && m.condicao !== 'Baixada') return false;
    if (f.sit === 'pendente' && !m.pendente) return false;
    if (f.sit === 'prevvenc' && !(prevVencida(m) && m.condicao !== 'Baixada')) return false;
    if (f.sit === 'prevprog' && !m.prevModo) return false;
    if (f.sit === 'semnf' && (m.nfArq || m.condicao === 'Baixada')) return false;
    if (f.sit === 'pesadas' && m.porte !== 'Pesada') return false;
    if (f.local === '@transito' && !m.transito) return false;
    if (f.local === '@manut' && (m.transito || ['Oficina interna', 'Oficina externa'].indexOf(tipoLocal(m)) < 0)) return false;
    if (f.local === '@obras' && (m.transito || tipoLocal(m) !== 'Obra')) return false;
    if (f.local === '@almox' && (m.transito || tipoLocal(m) !== 'Almoxarifado')) return false;
    if (f.local && f.local[0] !== '@' && (m.local !== f.local || m.transito)) return false;
    if (f.tipo && f.tipo.indexOf('cat:') === 0 && categoriaDe(m.tipo) !== f.tipo.slice(4)) return false;
    if (f.tipo && f.tipo.indexOf('cat:') !== 0 && m.tipo !== f.tipo) return false;

// Lê o arquivo; fotos grandes são reduzidas antes de enviar
const ACEITA_NF = 'application/pdf,image/' + '*';
function lerArquivo(file) {
  return new Promise(function (ok, erro) {
    const rd = new FileReader();
    rd.onerror = function () { erro(new Error('Não foi possível ler o arquivo.')); };
    rd.onload = function () {
      const url = rd.result;
      if (!/^image[/]/.test(file.type) || (file.size < 1.5 * 1048576 && /jpe?g|png|webp/.test(file.type))) return ok({ nome: file.name, mime: file.type || 'application/pdf', dados: String(url).split(',')[1] });
      const img = new Image();
      img.onload = function () {
        const k = Math.min(1, 2000 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        ok({ nome: file.name.replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', dados: cv.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      img.onerror = function () { erro(new Error('Formato de imagem não suportado. Envie em JPG, PNG ou PDF.')); };
      img.src = url;
    };
    rd.readAsDataURL(file);
  });
}
function enviarNF(tag, file) {
  if (file.size > 25 * 1048576) { toast('Arquivo muito grande. Envie até 10 MB.', 'warn'); return Promise.resolve(); }
  toast('Enviando a nota fiscal...', 'warn');
  return lerArquivo(file).then(function (a) {
    if (a.dados.length * 0.75 > 10 * 1048576) throw new Error('Arquivo maior que 10 MB.');
    return chamar('anexarNF', [TOKEN, tag, a]);
  }).then(function (r) { aplicar(r.pacote); toast('Nota fiscal guardada: ' + r.nome); }).catch(function (e) { if (e && e.message && !/SESSAO/.test(e.message)) toast(String(e.message).replace(/^Error:\s?/, ''), 'bad'); });
}

ACT.nfVer = function (el) {
  const tag = el.dataset.arg;
  const m = IDX.maq[tag] || {};

  const semVisor = /\.pdf$/i.test(m.nfArqNome || '') && navigator.pdfViewerEnabled === false;

  chamar('verNF', [TOKEN, tag]).then(function (r) {
    const bin = atob(r.dados), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: r.mime }));

const OS_ABERTOS = ['Em atendimento', 'Aguardando peça'];

function osAbertaDe(tag) { return (S && S.manut && S.manut.abertas && S.manut.abertas[tag]) || null; }

// ---------- Fotos ----------
// Reduz a foto no aparelho (máx. 1600 px, JPEG) antes de enviar
function lerFoto(file) {
  return new Promise(function (ok, erro) {
    if (!/^image[/]/.test(file.type || 'image/')) return erro(new Error('Escolha uma foto.'));
    const rd = new FileReader();
    rd.onerror = function () { erro(new Error('Não foi possível ler a foto.')); };
    rd.onload = function () {
      const img = new Image();
      img.onload = function () {
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        const url = cv.toDataURL('image/jpeg', 0.82);
        ok({ nome: String(file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg', mime: 'image/jpeg', dados: url.split(',')[1], url: url });
      };
      img.onerror = function () { erro(new Error('Formato de foto não suportado. Use JPG ou PNG.')); };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}

function chipPreventiva(m) {

const TIPO_SOL = {

function solPorId(id) { return S.sol ? S.sol.solicitacoes.find(function (x) { return x.id === id; }) || null : null; }
function locPorId(id) { return S.sol ? S.sol.locacoes.find(function (x) { return x.id === id; }) || null : null; }

function chipSol(x) { return '<span class="chip ' + corSol(x.status) + '"><span class="dot"></span>' + esc(x.status) + '</span>'; }

  if (!solAberta(x)) return x.tempoAtendimentoMin !== '' ? '<span class="chip">atendida em ' + fmtTempo(x.tempoAtendimentoMin) + '</span>' : '';

// Máquinas próprias para atribuir: do mesmo tipo, de qualquer local
function candidatos(x) {
  const c = UI.cand;
  const tipos = (S.tipos || []).filter(function (t) { return t.categoria === x.categoria; }).map(function (t) { return t.tipo; });
  const q = c.q.trim().toLowerCase();
  const nota = function (m) { const tl = tipoLocal(m); return (m.condicao === 'Operando' && !m.transito && !m.reserva && !osAbertaDe(m.tag) ? 0 : 2) + (['Almoxarifado', 'Oficina interna'].indexOf(tl) >= 0 ? 0 : 1); };
  return proprias().filter(function (m) {
    if (m.condicao === 'Baixada') return false;
    if (!c.todos && tipos.indexOf(m.tipo) < 0) return false;
    return !q || [m.tag, m.tipo, m.marca, m.modelo, ondeEsta(m)].join(' ').toLowerCase().indexOf(q) >= 0;
  }).sort(function (a, b) { return nota(a) - nota(b) || a.tag.localeCompare(b.tag, 'pt-BR', { numeric: true }); });
}

ACT.solViab = function (el) {

  const porDia = loc / dias, porMes = porDia * 30;

  const meses = porMes ? compra / porMes : 0;
  const vezes = loc ? compra / loc : 0;
  const R = function (v) { return fmtR(Math.round(v * 100) / 100); };

    '<table>' + linha('Obra', esc(locNome(x.obra))) + linha('Máquina', esc(x.categoria + (x.especificacao ? ' · ' + x.especificacao : ''))) + linha('Quantidade', x.qtd) +
      linha('Serviço', esc(x.servico)) + linha('Etapa da PQ', esc(x.etapaPQ || '—')) + linha('Duração prevista pela obra', plural(x.duracaoDias, 'dia', 'dias')) + '</table>' +
    '<table>' + linha('Fornecedor', esc(locNome(d.fornecedor) || '—')) + linha('Período', (d.inicio ? fmtD(d.inicio) + ' a ' + fmtD(d.fim) + ' · ' : '') + plural(dias, 'dia', 'dias') + (d.periodo && d.periodo !== plural(dias, 'dia', 'dias') ? ' (' + esc(d.periodo) + ')' : '')) +
      linha('Valor da locação no período', '<b>' + R(loc) + '</b>') + linha('Custo por dia · por mês (30 dias)', R(porDia) + ' · ' + R(porMes)) +
      linha('Valor de aquisição (' + plural(x.qtd || 1, 'unidade', 'unidades') + ')', '<b>' + R(compra) + '</b>') + '</table>' +
    '<table>' + linha('Locação em relação à compra', '<b>' + pct.toFixed(1).replace('.', ',') + '%</b> do valor de aquisição') +
      linha('Meses de uso para a compra se pagar', '<b>' + meses.toFixed(1).replace('.', ',') + ' meses</b> (no custo mensal desta locação)') +
      linha('Locações iguais a esta que pagam a compra', vezes.toFixed(1).replace('.', ',') + ' vezes') + '</table>' +
    (d.obs ? '<p><b>Observações:</b> ' + esc(d.obs) + '</p>' : '') +

// =====================================================================
// Frete
// Quadros: Aguardando aprovação · Hoje · Amanhã · Depois de amanhã · Mais adiante.
// O que ficou para trás volta para Hoje como "em atraso". Cargas são quadros
// criados pelo administrativo; os romaneios saem em lote, um por frete.
// =====================================================================
let FRT = null;
const FR_ST = { AG: 'Aguardando aprovação', AP: 'Aprovado', ROTA: 'Em rota', ENT: 'Entregue', PARC: 'Entregue parcial', REC: 'Recusado', CANC: 'Cancelado' };
const FR_ABERTOS = [FR_ST.AG, FR_ST.AP, FR_ST.ROTA];
const COR_PRIO = { 'Emergência': 'bad', 'Urgência': 'bad', 'Prioritário': 'warn', 'Normal': 'info', 'Agendado': 'accent' };
const QUADROS_DIA = [['hoje', 'Hoje', 0], ['amanha', 'Amanhã', 1], ['depois', 'Depois de amanhã', 2], ['adiante', 'Mais adiante', 3]];

function aplicarFrete(p, o) {
  o = o || {};
  if (!p) return;
  if (p.versao && !o.doAparelho) { SINC.versoes.frt = p.versao; SINC.dados.frt = copia(p); guardarTudo(); }
  FRT = p;
  aplicarFilaFrete();
  if (S) { montarCasca(); if (['fretes', 'receber'].indexOf(UI.view) >= 0 && !o.semRender) render(); }
}
function toque() { return !!(window.matchMedia && matchMedia('(pointer: coarse)').matches); }
function freteLigado() { return !!(FRT && FRT.configurado); }
function freteDe(id) { return FRT ? FRT.fretes.find(function (f) { return f.id === id; }) : null; }
function gestorFrete() { return pode('freteGerir'); }
function diaLocal(somar) { const d = new Date(); d.setDate(d.getDate() + (somar || 0)); return dataHoraLocal(d).slice(0, 10); }
function freteAberto(f) { return FR_ABERTOS.indexOf(f.status) >= 0; }
function parcialPendente(f) { return f.status === FR_ST.PARC && !f.decisaoParcial; }
function emAtraso(f) { return [FR_ST.AP, FR_ST.ROTA].indexOf(f.status) >= 0 && f.dia && f.dia < diaLocal(0); }

// Em qual quadro o frete aparece
function quadroDe(f) {
  if (f.status === FR_ST.AG) return 'ag';
  if ([FR_ST.AP, FR_ST.ROTA].indexOf(f.status) < 0) return '';
  if (f.carga) return 'carga:' + f.carga;
  const d = f.dia || diaLocal(0);
  if (d <= diaLocal(0)) return 'hoje';
  if (d === diaLocal(1)) return 'amanha';
  if (d === diaLocal(2)) return 'depois';
  return 'adiante';
}
function diaDoQuadro(q) { const x = QUADROS_DIA.find(function (k) { return k[0] === q; }); return x ? diaLocal(x[2]) : ''; }

function itensFrete(f) {
  return f.itens.map(function (i) { return i.tipo === 'Máquina' ? (i.tag ? i.tag : i.descricao) : numFmt(i.qtd) + ' ' + i.unidade + ' ' + i.descricao; }).join(', ');
}
function chipStatusFrete(f) {
  const c = { 'Aguardando aprovação': 'warn', Aprovado: 'info', 'Em rota': 'accent', Entregue: 'ok', 'Entregue parcial': 'warn', Recusado: 'bad', Cancelado: '' }[f.status];
  return '<span class="chip ' + (c || '') + '"><span class="dot"></span>' + esc(f._recebPend ? 'Recebimento a enviar' : f.status) + '</span>';
}
function dataCurta(d) { if (!d) return ''; const p = String(d).slice(0, 10).split('-'); return p[2] + '/' + p[1]; }
function chipData(f) {
  if (f.dia && [FR_ST.AP, FR_ST.ROTA].indexOf(f.status) >= 0) return '<span class="chip" title="Dia do frete">' + ic('clock', 'ic-sm') + dataCurta(f.dia) + '</span>';
  const d = f.prioridade === 'Agendado' ? f.dataAgendada : f.prazo;
  return d ? '<span class="chip" title="' + (f.prioridade === 'Agendado' ? 'Data agendada' : 'Prazo') + ': ' + esc(fmtD(d)) + '">' + ic('clock', 'ic-sm') + dataCurta(d) + (String(d).length > 10 ? ' ' + String(d).slice(11, 16) : '') + '</span>' : '';
}

// Cartão: número, urgência e data na primeira linha
function cardFr(f, o) {
  o = o || {};
  const arrasta = o.arrastar && gestorFrete() && [FR_ST.AG, FR_ST.AP].indexOf(f.status) >= 0;
  return '<div class="frc' + (emAtraso(f) ? ' atraso' : '') + (f._recebPend ? ' pend' : '') + '"' + (arrasta ? ' draggable="true"' : '') + ' data-fr="' + esc(f.id) + '" data-act="frAbrir" data-arg="' + esc(f.id) + '">' +
    '<div class="frc-h"><b class="mono">' + esc(f.id) + '</b><span class="chip ' + (COR_PRIO[f.prioridade] || '') + '">' + esc(f.prioridade) + '</span>' + chipData(f) + '</div>' +
    '<div class="frc-r">' + esc(f.origemNome) + ' → ' + esc(f.destinoNome) + '</div>' +
    '<div class="small muted frc-i">' + esc(f.tipoFrete) + ' · ' + esc(itensFrete(f)) + '</div>' +
    ((emAtraso(f) || f.status === FR_ST.ROTA || f.romaneio || o.status) ? '<div class="row wrap" style="gap:4px;margin-top:6px">' +
      (emAtraso(f) ? '<span class="chip bad">Em atraso</span>' : '') + (o.status ? chipStatusFrete(f) : f.status === FR_ST.ROTA ? '<span class="chip accent">Em rota</span>' : '') +
      (f.romaneio ? '<span class="chip">' + ic('doc', 'ic-sm') + esc(f.romaneio) + '</span>' : '') + '</div>' : '') +
    '</div>';
}

    QUADROS_DIA.map(function (k) { return col(k[0], k[1], por[k[0]], '<span class="faint small qd-d">' + (k[2] < 3 ? dataCurta(diaLocal(k[2])) : 'a partir de ' + dataCurta(diaLocal(3))) + '</span>'); }).join('') + '</div>';

    return '<div class="qd carga" data-quadro="carga:' + esc(c.id) + '"><div class="qd-h"><b class="click" data-act="cgRenomear" data-arg="' + esc(c.id) + '" title="Renomear">' + esc(c.nome) + '</b><span class="chip">' + lista.length + '</span>' +
      (c.saiuEm ? '<span class="chip accent">Saiu ' + fmtD(c.saiuEm).slice(0, 5) + '</span>' : '') + '</div>' +
      '<div class="small ' + (c.veiculo ? 'muted' : 'faint') + ' qd-t">' + ic('car', 'ic-sm') + ' ' + esc(c.veiculo ? descTransp(c, true) : 'Sem veículo definido') + '</div>' +
      '<div class="row wrap qd-a">' +
        (!c.saiuEm ? '<button class="btn sm ghost" data-act="cgTransp" data-arg="' + esc(c.id) + '">' + (c.veiculo ? 'Transporte' : 'Definir veículo') + '</button>' : '') +
        (semRom ? '<button class="btn sm primary" data-act="cgRomaneios" data-arg="' + esc(c.id) + '">' + ic('doc', 'ic-sm') + 'Gerar romaneios (' + semRom + ')</button>' : '') +

        (prontos && !semRom ? '<button class="btn sm" data-act="cgSaiu" data-arg="' + esc(c.id) + '">' + ic('send', 'ic-sm') + 'Saiu</button>' : '') +
        (!lista.length ? '<button class="btn sm ghost" data-act="cgArquivar" data-arg="' + esc(c.id) + '">Arquivar</button>' : '') + '</div>' +
      '<div class="qd-b">' + (lista.length ? lista.map(function (f, k) { return '<div class="ord-wrap"><span class="ord">' + (k + 1) + '</span>' + cardFr(f, { arrastar: true }) + '</div>'; }).join('') : '<div class="qd-vazio">Arraste os fretes desta carga para cá</div>') + '</div></div>';

// ---------- Arrastar entre quadros ----------
AFTER.fretes = function () {
  if (!FRT || !gestorFrete()) return;
  let arr = null;
  document.querySelectorAll('#main .frc[draggable]').forEach(function (el) {
    el.addEventListener('dragstart', function (e) { arr = el.dataset.fr; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', arr); } catch (x) { } });
    el.addEventListener('dragend', function () { el.classList.remove('drag'); document.querySelectorAll('.qd.sobre,.frc.antes,.frc.depois').forEach(function (x) { x.classList.remove('sobre', 'antes', 'depois'); }); });
  });
  document.querySelectorAll('#main .qd').forEach(function (q) {
    q.addEventListener('dragover', function (e) {
      if (!arr) return;
      e.preventDefault(); q.classList.add('sobre');
      if (q.dataset.quadro.indexOf('carga:') === 0) {
        q.querySelectorAll('.frc').forEach(function (c) { c.classList.remove('antes', 'depois'); });
        const alvo = e.target.closest && e.target.closest('.frc');
        if (alvo && alvo.dataset.fr !== arr) { const r = alvo.getBoundingClientRect(); alvo.classList.add(e.clientY > r.top + r.height / 2 ? 'depois' : 'antes'); }
      }
    });
    q.addEventListener('dragleave', function (e) { if (!q.contains(e.relatedTarget)) q.classList.remove('sobre'); });
    q.addEventListener('drop', function (e) {
      e.preventDefault(); q.classList.remove('sobre');
      if (!arr) return;
      const alvo = q.querySelector('.frc.antes,.frc.depois');
      const pos = alvo ? { id: alvo.dataset.fr, depois: alvo.classList.contains('depois') } : null;
      const id = arr; arr = null;
      soltarFrete(id, q.dataset.quadro, pos);
    });
  });
};

// Move o frete na tela na hora e confirma no servidor; se o servidor recusar, volta como estava
function soltarFrete(id, destino, pos) {
  const f = freteDe(id);
  if (!f) return;
  const de = quadroDe(f);
  if (destino === de && destino.indexOf('carga:') !== 0) return;
  const antes = copia(FRT);
  let chamada, msg = '', desfazer = null;
  if (destino === 'ag') {
    if (f.status !== FR_ST.AP) return toast('Este frete não pode voltar para aprovação.', 'warn');
    f.status = FR_ST.AG; f.dia = ''; f.carga = '';
    chamada = ['decidirFrete', [TOKEN, id, 'desfazer', {}]]; msg = 'Aprovação de ' + id + ' desfeita.';
  } else if (destino.indexOf('carga:') === 0) {
    const cg = destino.slice(6);
    const ids = FRT.fretes.filter(function (x) { return x.carga === cg && x.id !== id && [FR_ST.AP, FR_ST.ROTA].indexOf(x.status) >= 0; })
      .sort(function (a, b) { return a.ordemCarga - b.ordemCarga; }).map(function (x) { return x.id; });
    let k = pos ? ids.indexOf(pos.id) + (pos.depois ? 1 : 0) : ids.length;
    if (k < 0) k = ids.length;
    ids.splice(k, 0, id);
    if (f.status === FR_ST.AG) { f.status = FR_ST.AP; f.dia = f.dia || diaLocal(0); }
    f.carga = cg;
    ids.forEach(function (x, i) { const g = freteDe(x); if (g) g.ordemCarga = i + 1; });
    chamada = ['acaoCarga', [TOKEN, 'mover', { frete: id, carga: cg, ordem: ids }]];
    msg = de === destino ? '' : id + ' na carga ' + (FRT.cargas.find(function (c) { return c.id === cg; }) || {}).nome + '.';
  } else {
    const dia = diaDoQuadro(destino);
    const nome = (QUADROS_DIA.find(function (k) { return k[0] === destino; }) || [])[1];
    if (f.carga) { f.carga = ''; f.dia = dia; chamada = ['acaoCarga', [TOKEN, 'mover', { frete: id, carga: '', dia: dia }]]; msg = id + ' saiu da carga (' + nome + ').'; }
    else if (f.status === FR_ST.AG) {
      f.status = FR_ST.AP; f.dia = dia;
      chamada = ['decidirFrete', [TOKEN, id, 'aprovar', { dia: dia }]]; msg = id + ' aprovado para ' + nome.toLowerCase() + '.';
      desfazer = function () { chamar('decidirFrete', [TOKEN, id, 'desfazer', {}]).then(function (r) { aplicarFrete(r.frt); toast('Aprovação desfeita.'); }).catch(function () { }); };
    } else { f.dia = dia; chamada = ['decidirFrete', [TOKEN, id, 'dia', { dia: dia }]]; msg = id + ' passou para ' + nome.toLowerCase() + '.'; }
  }
  render();
  chamar(chamada[0], chamada[1]).then(function (r) {
    aplicarFrete(r.frt);
    if (msg) desfazer ? toastAcao(msg, 'Desfazer', desfazer) : toast(msg);
  }).catch(function () { FRT = antes; render(); });
}

// Aviso com botão (ex.: "Aprovado · Desfazer")
function toastAcao(msg, rotulo, fn) {
  const el = document.createElement('div');
  el.className = 'toast ok';
  el.style.pointerEvents = 'auto';
  el.innerHTML = ic('check') + '<span>' + esc(msg) + '</span><button class="toast-b">' + esc(rotulo) + '</button>';
  el.querySelector('button').onclick = function () { el.remove(); fn(); };
  const box = document.getElementById('toast');
  box.appendChild(el);
  while (box.children.length > 2) box.firstChild.remove();
  setTimeout(function () { el.remove(); }, 6500);
}

// ---------- Transporte: veículo da frota ou terceiro, motorista e valor ----------
function veiculosAtivos() { return (S.veiculos || []).filter(function (v) { return !/inativ|baixad|vendid/i.test(v.situacao || ''); }); }
function nomeVeic(veiculo, transportadora) {
  if (!veiculo) return '';
  if (veiculo === 'Terceiro') return 'Terceiro' + (transportadora ? ': ' + transportadora : '');
  const cod = String(veiculo).split(' · ')[0];
  const v = (S.veiculos || []).find(function (x) { return x.codigo === cod; });
  return v ? v.codigo + (v.marcaModelo ? ' · ' + v.marcaModelo : '') : String(veiculo);
}
function descTransp(t, comValor) {
  return [nomeVeic(t.veiculo, t.transportadora), t.motorista, comValor && t.valor !== '' && t.valor != null ? fmtR(t.valor) : ''].filter(Boolean).join(' · ');
}
// p = prefixo dos ids; bind = data-in do formulário que se redesenha (Novo frete)
function camposTransp(t, p, bind) {
  t = t || {};
  const at = function (c) { return ' id="' + p + '-' + c + '"' + (bind ? ' data-in="' + bind + '" data-arg="' + c + '"' : ''); };
  const terc = t.veiculo === 'Terceiro';
  const ops = veiculosAtivos().map(function (v) { return { v: v.codigo, t: v.codigo + (v.marcaModelo ? ' · ' + v.marcaModelo : '') }; });
  const atual = t.veiculo && t.veiculo !== 'Terceiro' ? String(t.veiculo).split(' · ')[0] : t.veiculo || '';
  return '<div class="stack"><div class="grid2"><label class="field"><span>Veículo</span><select class="input"' + at('veiculo') + '>' + sel(ops.concat([{ v: 'Terceiro', t: 'Terceiro (fora da frota)' }]), atual, 'Escolha') + '</select></label>' +
      '<label class="field" id="' + p + '-terc-box"' + (terc ? '' : ' hidden') + '><span>Transportadora / dono do veículo</span><input class="input"' + at('transportadora') + ' value="' + esc(t.transportadora || '') + '" placeholder="Ex.: Transportes Silva"></label></div>' +
    '<div class="grid2"><label class="field"><span>Motorista</span><input class="input"' + at('motorista') + ' value="' + esc(t.motorista || '') + '" placeholder="Nome de quem leva"></label>' +
      '<label class="field"><span>Valor do frete (R$)</span><input class="input" inputmode="decimal"' + at('valor') + ' value="' + esc(t.valor === '' || t.valor == null ? '' : String(t.valor).replace('.', ',')) + '" placeholder="Em branco se não houver custo"></label></div></div>';
}
function ligarTransp(p) {
  const v = document.getElementById(p + '-veiculo');
  if (v) v.onchange = function () { const b = document.getElementById(p + '-terc-box'); if (b) b.hidden = v.value !== 'Terceiro'; if (v.value === 'Terceiro') { const i = document.getElementById(p + '-transportadora'); if (i) i.focus(); } };
}
function lerTransp(p, exigir) {
  const g = function (c) { const e = document.getElementById(p + '-' + c); return e ? e.value.trim() : ''; };
  const t = { veiculo: g('veiculo'), transportadora: g('transportadora'), motorista: g('motorista'), valor: g('valor') };
  if (exigir && !t.veiculo) { toast('Escolha o veículo (da frota ou terceiro).', 'warn'); return null; }
  if (t.veiculo === 'Terceiro' && t.transportadora.length < 2) { toast('Informe a transportadora ou o dono do veículo terceiro.', 'warn'); return null; }
  if (t.veiculo !== 'Terceiro') t.transportadora = '';
  if (t.valor !== '') { const n = numBR(t.valor); if (n === '' || isNaN(n) || n < 0) { toast('Valor do frete inválido.', 'warn'); return null; } t.valor = n; }
  return t;
}
function modalTransp(titulo, sub, t, botao, enviar) {

  if (atual && !ops.some(function (o) { return o[0] === atual; })) ops.push([atual, dataCurta(atual)]);

}

// Código de barras Code 128 (conjunto B) em SVG: lido pelos leitores 1D das obras
// tabela C128: definida mais abaixo (romaneio de máquinas, versão 6)
function code128Svg(txt, alt) {
  txt = String(txt);
  const cods = [104];
  for (let i = 0; i < txt.length; i++) { const v = txt.charCodeAt(i) - 32; if (v < 0 || v > 94) return ''; cods.push(v); }
  let soma = 104;
  for (let i = 1; i < cods.length; i++) soma += cods[i] * i;
  cods.push(soma % 103); cods.push(106);
  const larg = cods.map(function (c) { return C128[c]; }).join('');
  let x = 10, barras = '';   // 10 módulos de margem de silêncio
  for (let i = 0; i < larg.length; i++) { const w = +larg[i]; if (i % 2 === 0) barras += '<rect x="' + x + '" y="0" width="' + w + '" height="' + (alt || 40) + '"/>'; x += w; }
  const total = x + 10;
  return '<svg class="c128" viewBox="0 0 ' + total + ' ' + (alt || 40) + '" width="' + (total * 1.5) + '" height="' + ((alt || 40) * 1.5) + '" preserveAspectRatio="none" shape-rendering="crispEdges"><g fill="#000">' + barras + '</g></svg>';
}

    body: '<label class="field"><span>Quantidade (' + esc(m.u) + ')</span><input class="input" id="car-q" inputmode="numeric" value="' + (ja ? ja.qtd : 1) + '"></label>' +

ACT.carOk = function (el) {
  const m = matDe(el.dataset.arg); if (!m) return;
  const q = numBR(document.getElementById('car-q').value);
  if (!(q > 0) || Math.floor(q) !== q) return toast('Informe a quantidade (número inteiro).', 'warn');
  const c = carrinho(), ja = c.find(function (x) { return x.material === m.id; });
  if (ja) ja.qtd = q; else c.push({ material: m.id, qtd: q, sel: true });
  salvarCarrinho(c); fecharModal(); render();
  toast(numFmt(q) + ' ' + m.u + ' de ' + nomeMat(m) + ' no carrinho' + (q > m.disp ? ' (acima do disponível hoje)' : '') + '.', q > m.disp ? 'warn' : undefined);
};

ACT.carPedido = function () {
  const sel = carrinho().filter(function (i) { return i.sel !== false && matDe(i.material); });
  if (!sel.length) return toast('Marque ao menos um material.', 'warn');
  for (let k = 0; k < sel.length; k++) { const q = numBR(sel[k].qtd); if (!(q > 0) || Math.floor(q) !== q) return toast('Quantidade inválida em ' + nomeMat(matDe(sel[k].material)) + '.', 'warn'); }
  ACT.epNovo();
  UI.ep.itens = sel.map(function (i) { return { material: i.material, qtd: String(numBR(i.qtd)) }; });
  UI.ep.doCarrinho = sel.map(function (i) { return i.material; });
  redesenharEP();
};

const C128 = ['212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213', '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132',

function code128(texto) {
  const vals = [104];
  for (let i = 0; i < texto.length; i++) {
    const c = texto.charCodeAt(i) - 32;
    vals.push(c >= 0 && c < 95 ? c : 0);
  }
  let soma = 104;
  for (let i = 1; i < vals.length; i++) soma += vals[i] * i;
  vals.push(soma % 103); vals.push(106);
  let x = 10, rects = '';
  vals.forEach(function (v) {
    const p = C128[v];
    for (let i = 0; i < p.length; i++) {
      const w = Number(p[i]);
      if (i % 2 === 0) rects += '<rect x="' + x + '" y="0" width="' + w + '" height="50"/>';
      x += w;
    }
  });
  return '<svg viewBox="0 0 ' + (x + 10) + ' 50" preserveAspectRatio="none" role="img" aria-label="Código ' + esc(texto) + '"><g fill="#000">' + rects + '</g></svg>';
}

function qrSvg(texto) {
  const q = qrcode(0, 'M'); q.addData(texto); q.make();

    r.itens.filter(function (i) { return i.situacao !== 'Extra'; }).map(function (i, k) { return '<tr><td>' + (k + 1) + '</td><td style="font-family:monospace;font-weight:700">' + esc(i.tag) + '</td><td>' + esc([(IDX.maq[i.tag] || {}).tipo, (IDX.maq[i.tag] || {}).marca, (IDX.maq[i.tag] || {}).modelo].filter(Boolean).join(' · ')) + '</td><td style="height:13mm;vertical-align:top"><div style="font-size:9pt;margin-bottom:2mm">☐ Completa &nbsp;&nbsp;&nbsp; ☐ Incompleta</div><div style="border-bottom:0.3mm solid #999;height:4mm"></div></td><td></td></tr>'; }).join('') +
    '</tbody></table>' + (r.obs ? '<p>Obs.: ' + esc(r.obs) + '</p>' : '') +
    '<div class="sig"><div>Expedição (origem)</div><div>Recebimento (destino)</div></div></div>');
};

// =====================================================================
// Eventos da página
// =====================================================================
document.addEventListener('click', function (ev) {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.tagName === 'TR' && ev.target.closest('[data-stop]') && !ev.target.closest('input')) return;
  if (el.tagName === 'TR' && ev.target.closest('input[type=checkbox]')) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName !== 'INPUT') ev.preventDefault();
  fn(el, ev);
});
document.addEventListener('change', function (ev) {
  const el = ev.target;
  if (el.matches('input[type=checkbox][data-act]')) return;
  if (el.type === 'file' && el.dataset.foto !== undefined) { fotosEscolhidas(el); return; }
  if (el.type === 'file' && el.dataset.fotoSol) { fotosSolEscolhidas(el); return; }
  if (el.type === 'file' && el.dataset.contrato) { const ref = el.dataset.contrato; if (el.files[0]) enviarContrato(ref, el.files[0], function () { if (/^SOL/.test(ref)) abrirSol(ref); else abrirLocacao(ref); }); return; }
  inputMudou(el, true);
});
document.addEventListener('input', function (ev) {
  const el = ev.target;
  if (el.tagName === 'SELECT' || el.type === 'date' || el.type === 'datetime-local') return;
  inputMudou(el, false);
});
let tBusca = null;
function inputMudou(el, change) {
  const k = el.dataset.in, a = el.dataset.arg;
  if (!k) return;
  if (IN[k]) { IN[k](el, a, change); return; }
  if (k === 'env') { UI.env[a] = el.value; if (a === 'destino' || a === 'origem') { if (a === 'origem' && UI.env.destino === el.value) UI.env.destino = ''; salvarEnv(); render(); } else salvarEnv(); return; }
  if (k === 'envMotivo') { const it = UI.env.itens.find(function (i) { return i.tag === a; }); if (it) it.motivo = el.value; salvarEnv(); return; }
  if (k === 'rec') { UI.rec[a] = el.value; if (change && a === 'local') render(); return; }
  if (k === 'recMotivo') { UI.rec.motivos[a] = el.value; return; }
  if (k === 'recDestino') { UI.recDestino = el.value; render(); return; }
  if (k === 'invLocal') { UI.invLocal = el.value; render(); return; }
  if (k === 'sf') { UI.sf[a] = el.value; if (a === 'obra') UI.sfObra = el.value; if (el.dataset.render && change) { if (a === 'obra') { UI.sf.dev = {}; UI.sf.locacao = ''; } render(); } return; }
  if (k === 'sfItem') { const p = a.split(':'); if (UI.sf && UI.sf.itens[+p[0]]) UI.sf.itens[+p[0]][p[1]] = el.value; return; }
  if (k === 'cand') { UI.cand.q = el.value; clearTimeout(tBusca); tBusca = setTimeout(redesenharCand, 180); return; }
  if (k === 'ff') { UI.ff[a] = el.value; return; }
  if (k === 'ffItem') { const p = a.split(':'); if (UI.ff.itens[+p[0]]) UI.ff.itens[+p[0]][p[1]] = el.value; return; }
  if (k === 'ffPonto') { if (!change) return; UI.ff[a] = el.value === '@outro' ? { texto: '' } : el.value ? { id: el.value } : {}; redesenharFF(); return; }
  if (k === 'ffTexto') { UI.ff[a] = { texto: el.value }; return; }
  if (k === 'tpQ') { UI.tpQ = el.value; clearTimeout(tBusca); tBusca = setTimeout(function () { const pos = el.selectionStart; render(); const n = document.querySelector('[data-in="tpQ"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } } }, 180); return; }
  if (k === 'usuPerfil') { const b = document.getElementById('perms-box'); if (b) b.innerHTML = blocoPerms(el.value, permsPadrao(el.value)); return; }
  if (k === 'usuPerm') { if (!change) return; const pf = document.querySelector('#f-usu [name=perfil]'); const b = document.getElementById('perms-box'); if (b && pf) b.innerHTML = blocoPerms(pf.value, permsMarcadas()); return; }
  if (k === 'osTransp') { const b = document.getElementById('os-transp'); if (b) b.hidden = !el.checked; return; }
  if (k === 'osVolta') { const b = document.getElementById('os-volta'); if (b) b.hidden = !el.checked; return; }
  if (k === 'concRes') {
    const bx = document.getElementById('conc-baixar'), info = document.getElementById('conc-info');
    const sem = el.value === 'Sem conserto';
    if (bx) bx.hidden = !sem;
    if (info) info.innerHTML = sem ? 'A máquina fica como <b>Avariada</b>' + (bx ? ', ou <b>Baixada</b> se você marcar a opção abaixo.' : '. Quem aprova manutenção pode baixá-la depois.') : 'A máquina volta para <b>Operando</b> e fica disponível para envio.';
    return;
  }
  if (['maqF', 'romF', 'locF', 'manF', 'obraF', 'solF', 'osF', 'lcF', 'prevF'].indexOf(k) >= 0) {
    const alvo = UI[k] || (UI[k] = {});
    alvo[a] = el.value;
    if (k === 'maqF') UI.maqLim = 60;
    if (el.tagName === 'SELECT') { render(); return; }
    clearTimeout(tBusca);
    tBusca = setTimeout(function () {
      const pos = el.selectionStart;
      render();
      const n = document.querySelector('[data-in="' + k + '"][data-arg="' + a + '"]');
      if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { } }
    }, 180);
  }
}
document.addEventListener('keydown', function (ev) {
  const el = ev.target;
  if (ev.key === 'Escape' && document.getElementById('ov')) { fecharModal(); return; }
  if (el.dataset && el.dataset.scan && ev.key === 'Enter') {
    ev.preventDefault();
    const tag = tagLida(el.value);
    el.value = '';
    if (!tag) return;
    SCAN[el.dataset.scan](tag, el);
    const n = document.querySelector('[data-scan="' + el.dataset.scan + '"]');
    const novo = document.getElementById('tipo-novo');
    if (n && !novo && document.body.contains(n)) n.focus();
    return;
  }
  if (el.id === 'tipo-novo' && ev.key === 'Enter') {
    ev.preventDefault();
    const b = document.querySelector('[data-act=novoConfirmar]');
    if (b) b.click();
    setTimeout(function () { const n = document.querySelector('[data-scan]'); if (n) n.focus(); }, 40);
  }
});
window.addEventListener('resize', function () { if (UI.view === 'maquinas' && S) { const c = document.getElementById('maq-cards'); if (c) c.style.display = window.innerWidth <= 640 ? 'flex' : 'none'; } });

// =====================================================================
// Início
// =====================================================================
(function () {
  const m = new URLSearchParams(location.search).get('m');
  if (!m) return;
  try { sessionStorage.setItem('cm_abrir', m); } catch (e) { }
  try { history.replaceState(null, '', location.pathname + '#hist/historico'); } catch (e) { }
})();
TOKEN = ls('cm_token');
if (TOKEN) iniciar().then(function () { if (!S && document.getElementById('tela-troca').hidden) mostrarLogin(''); }); else mostrarLogin('');
</script>
